# Aegis-V2X — Local development stack
# `dev` runs always (Phase 1 baseline). `postgres` and `backend` need the
# "backend" profile; `prometheus` and `grafana` need the "monitoring"
# profile -- feeding the live demo's TwinTrust-AP telemetry through to a
# Grafana dashboard (`docker compose --profile backend --profile monitoring up --build`).
version: "3.9"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    tty: true

  postgres:
    image: postgres:16-alpine
    profiles: ["backend"]
    environment:
      POSTGRES_DB: aegis_v2x
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: change_me_in_env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_v2x"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:change_me_in_env@postgres:5432/aegis_v2x
      CORS_ALLOW_ORIGINS: >-
        http://localhost:5173,http://localhost:8000,
        http://localhost:5500,http://127.0.0.1:5500,
        https://logapriya05.github.io
    ports:
      - "8000:8000"

  # Scrapes `backend:8000/metrics` (prometheus-fastapi-instrumentator +
  # the live telemetry metrics in app/core/metrics.py) every 5s -- see
  # configs/monitoring/prometheus.yml.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./configs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Pre-provisioned with the Prometheus datasource and the "Aegis-V2X
  # Backend Overview" dashboard -- see configs/monitoring/grafana/.
  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: aegis
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
