[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
extend_skip = ["backend/alembic"]
# backend/alembic/ (env.py plus the autogenerated versions/ migrations)
# is Alembic's own generated/templated code, not hand-authored to this
# project's import-order convention -- skipped rather than reformatted,
# same rationale as excluding versions/ from flake8 in .flake8.
# "app" lives nested at backend/app rather than the repo root, so isort's
# auto-detection (which only looks at top-level directories relative to
# where it runs) never recognizes it as first-party on its own -- without
# this, `make lint` (which runs isort from the repo root) misclassifies
# every `from app.xxx import ...` in backend/ as third-party and wants to
# interleave it alphabetically with fastapi/starlette/etc, contradicting
# how the codebase is actually and correctly written.

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# backend/alembic/ is Alembic's generated/templated code (same reason isort skips it above).
# Run as part of `mypy backend`, that directory shadows the installed `alembic` package and
# mypy reports "Module 'alembic' has no attribute 'op'/'context'" for code that runs correctly.
exclude = ["^backend/alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["."]
